// 顶层构建：AGP 8.7 + Kotlin 2.0（Gradle 8.9+ 可跑；本仓库 .gradle 已缓存 8.14.3）
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
