// 顶层构建。AGP 与 Kotlin 插件的版本出处就是下面的 buildscript，本行不复写版本号。
// Gradle 用哪一枚不在这里声明：wrapper 与 CI 各写一次，两处必须同枚且落在 AGP 的支持范围内，
// 由 Server/scripts/BuildToolchain.mjs 在 Server CI 里断言（F61：三处各写一次必然漂移）。
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'
    }
    // 插件类路径的传递依赖同样进锁：buildscript-gradle.lockfile（F71）。
    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
