// 应用模块：Capacitor 壳 + BakaChannel 原生插件（插件源码直接放 app 内，
// 经 MainActivity 的 bridge.registerPlugin 注册，不做独立 npm 插件包）。
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
// 不 apply @capacitor/android 里的脚本：7.x 的包里**没有** capacitor.gradle
// （实测 7.4.0 与 7.6.9 都只有 capacitor/build.gradle），原先这行会让 Gradle 直接
// 报 "Could not read script ... capacitor.gradle as it does not exist"，整个 APK 构建失败。
// Capacitor 运行时的接入方式就在 settings.gradle 的 include ':capacitor-android'
// 与下面 dependencies 里的 implementation project(':capacitor-android')，两处已齐。

android {
    namespace 'website.baka.game'
    compileSdk 35
    // 本机已装 build-tools 34.0.0/36.0.0，无 35.0.0；显式钉住避免 AGP 触发联网下载
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'website.baka.game'
        // Key Attestation 自 API 24 起可用，minSdk 与计划 P3.2 口径一致
        minSdk 24
        targetSdk 35
        versionCode 1
        // versionName 由 scripts/prepare-web.mjs 从 Mobile/package.json 同步，勿手改
        versionName '0.1.0'
    }

    // 正式签名：四项环境变量齐全才装配，缺任意一项就退回「release 不签名」，
    // 免得没有密钥的构建一上来就报错。密钥本体与口令都不进仓库，路径也交给环境变量。
    def keystorePath = System.getenv("BAKA_KEYSTORE_PATH")
    // 变量名统一加 baka 前缀：`keyAlias keyAlias` 这种同名的命令式写法会被 Groovy 解析成
    // 「对 String 调用 call(...)」，报 "No signature of method: java.lang.String.call()"，
    // 而错误发生在整个 project 求值阶段，看起来跟签名毫无关系。一律改成显式赋值。
    def bakaKeystorePassword = System.getenv("BAKA_KEYSTORE_PASSWORD")
    def bakaKeyAlias = System.getenv("BAKA_KEY_ALIAS")
    def bakaKeyPassword = System.getenv("BAKA_KEY_PASSWORD")
    def releaseKeystore =
        keystorePath && bakaKeystorePassword && bakaKeyAlias && bakaKeyPassword
        ? keystorePath : null

    signingConfigs {
        if (releaseKeystore) {
            bakaRelease {
                storeFile = file(releaseKeystore)
                storePassword = bakaKeystorePassword
                keyAlias = bakaKeyAlias
                keyPassword = bakaKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            // WebView 远程调试仅 debug 构建开启（Capacitor 按 BuildConfig.DEBUG 处理）
        }
        release {
            minifyEnabled false
            // 没有密钥时产物保持 unsigned：Android Key Attestation 要求签名摘要匹配
            // （见 README §7 与 Server/docs/ClientChannel.md），未签名的包只能拿 degraded 档
            if (releaseKeystore) signingConfig signingConfigs.findByName('bakaRelease')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // 产物名带版本号，配合 P2.7 的 R2 固定别名分发策略
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            outputFileName = "BakaGame-${variant.versionName}-${variant.name}.apk"
        }
    }
}

dependencies {
    implementation project(':capacitor-android')
    // styles.xml 的 AppTheme.NoActionBarLaunch 继承 Theme.SplashScreen，该主题由这个库提供。
    // 不声明就会在 processDebugResources 阶段报 "resource style/Theme.SplashScreen not found"。
    implementation 'androidx.core:core-splashscreen:1.0.1'
    // 电容的 com.getcapacitor.BridgeActivity 继承 AppCompatActivity（Capacitor 5 起如此），
    // 但它在 capacitor-android 里是 implementation 依赖、不会传递到本模块的编译类路径。
    // 缺了它 Kotlin 侧会报一整片连锁错误（AppCompatActivity 不可访问 → Plugin 基类解析失败
    // → asyncCall / context / reject 全部 unresolved），看着像十几个 bug，其实只有一个。
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
