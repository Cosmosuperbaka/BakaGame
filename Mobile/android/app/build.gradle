// 应用模块：Capacitor 壳 + BakaChannel 原生插件（插件源码直接放 app 内，
// 经 MainActivity 的 bridge.registerPlugin 注册，不做独立 npm 插件包）。
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// HTTPDNS 的 AppID/密钥只在构建期从环境变量注入，仓库里只有变量名。
// AES 模式需要 16 位密钥；HTTPS Token 模式优先，二者都没有时壳不启用回环解析隧道。
def bakaHttpDnsAppId = System.getenv("BAKA_HTTPDNS_APP_ID") ?: ""
def bakaHttpDnsSecret = System.getenv("BAKA_HTTPDNS_SECRET_KEY") ?: ""
def bakaHttpDnsToken = System.getenv("BAKA_HTTPDNS_TOKEN") ?: ""
def bakaHttpDnsDomain = System.getenv("BAKA_HTTPDNS_DOMAIN") ?: ""
if (!bakaHttpDnsDomain && System.getenv("VITE_SERVER_URL")) {
    // 壳的页面 origin 与接口同源；域名与 C2 的 server.hostname 用同一个来源。
    try {
        bakaHttpDnsDomain = new URL(System.getenv("VITE_SERVER_URL")).getHost()
    } catch (Exception ignored) {
        bakaHttpDnsDomain = ""
    }
}
// Java 字符串字面量转义：BuildConfig 是生成的 Java 源文件。
def bakaJavaString = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}
// 不 apply @capacitor/android 里的脚本：7.x 的包里**没有** capacitor.gradle
// （实测 7.4.0 与 7.6.9 都只有 capacitor/build.gradle），原先这行会让 Gradle 直接
// 报 "Could not read script ... capacitor.gradle as it does not exist"，整个 APK 构建失败。
// Capacitor 运行时的接入方式就在 settings.gradle 的 include ':capacitor-android'
// 与下面 dependencies 里的 implementation project(':capacitor-android')，两处已齐。

android {
    namespace 'website.baka.game'
    compileSdk 35
    // 本机已装 build-tools 34.0.0/36.0.0，无 35.0.0；显式钉住避免 AGP 触发联网下载
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'website.baka.game'
        // Key Attestation 自 API 24 起可用，minSdk 与计划 P3.2 口径一致
        minSdk 24
        targetSdk 35
        versionCode 2
        // versionName 由 scripts/prepare-web.mjs 从 Mobile/package.json 同步，勿手改
        versionName '0.1.1'

        // 密钥进 DEX 的 BuildConfig，不进 Web 产物；空值表示本次构建未启用 HTTPDNS。
        buildConfigField "String", "HTTPDNS_APP_ID", bakaJavaString(bakaHttpDnsAppId)
        buildConfigField "String", "HTTPDNS_SECRET_KEY", bakaJavaString(bakaHttpDnsSecret)
        buildConfigField "String", "HTTPDNS_TOKEN", bakaJavaString(bakaHttpDnsToken)
        buildConfigField "String", "HTTPDNS_DOMAIN", bakaJavaString(bakaHttpDnsDomain)
    }

    buildFeatures {
        // AGP 8 起 BuildConfig 生成默认关闭；下面四个字段要落进 BuildConfig。
        buildConfig true
    }

    // 正式签名：四项环境变量齐全才装配，缺任意一项就退回「release 不签名」，
    // 免得没有密钥的构建一上来就报错。密钥本体与口令都不进仓库，路径也交给环境变量。
    def keystorePath = System.getenv("BAKA_KEYSTORE_PATH")
    // 变量名统一加 baka 前缀：`keyAlias keyAlias` 这种同名的命令式写法会被 Groovy 解析成
    // 「对 String 调用 call(...)」，报 "No signature of method: java.lang.String.call()"，
    // 而错误发生在整个 project 求值阶段，看起来跟签名毫无关系。一律改成显式赋值。
    def bakaKeystorePassword = System.getenv("BAKA_KEYSTORE_PASSWORD")
    def bakaKeyAlias = System.getenv("BAKA_KEY_ALIAS")
    def bakaKeyPassword = System.getenv("BAKA_KEY_PASSWORD")
    def releaseKeystore =
        keystorePath && bakaKeystorePassword && bakaKeyAlias && bakaKeyPassword
        ? keystorePath : null

    signingConfigs {
        if (releaseKeystore) {
            bakaRelease {
                storeFile = file(releaseKeystore)
                storePassword = bakaKeystorePassword
                keyAlias = bakaKeyAlias
                keyPassword = bakaKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            // WebView 远程调试仅 debug 构建开启（Capacitor 按 BuildConfig.DEBUG 处理）
        }
        release {
            minifyEnabled false
            // 没有密钥时产物保持 unsigned：Android Key Attestation 要求签名摘要匹配
            // （见 README §7 与 Server/docs/ClientChannel.md），未签名的包只能拿 degraded 档
            if (releaseKeystore) signingConfig signingConfigs.findByName('bakaRelease')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // 产物名带版本号：分发既用带版本的对象名，也用不带版本号的固定别名
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            outputFileName = "BakaGame-${variant.versionName}-${variant.name}.apk"
        }
    }
}

dependencies {
    implementation project(':capacitor-android')
    // styles.xml 的 AppTheme.NoActionBarLaunch 继承 Theme.SplashScreen，该主题由这个库提供。
    // 不声明就会在 processDebugResources 阶段报 "resource style/Theme.SplashScreen not found"。
    implementation 'androidx.core:core-splashscreen:1.0.1'
    // 电容的 com.getcapacitor.BridgeActivity 继承 AppCompatActivity（Capacitor 5 起如此），
    // 但它在 capacitor-android 里是 implementation 依赖、不会传递到本模块的编译类路径。
    // 缺了它 Kotlin 侧会报一整片连锁错误（AppCompatActivity 不可访问 → Plugin 基类解析失败
    // → asyncCall / context / reject 全部 unresolved），看着像十几个 bug，其实只有一个。
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // WebView 的 WebAuthn 开关（MainActivity 的 setWebAuthenticationSupport）从 1.12.1 起提供；
    // 钉 1.14.0 与官方 WebView 通行密钥指引同一枚。设备 WebView 太旧时会由
    // WebViewFeature.isFeatureSupported 兜住，继续按不支持 WebAuthn 降级。
    implementation 'androidx.webkit:webkit:1.14.0'
}
