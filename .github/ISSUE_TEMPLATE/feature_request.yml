name: 功能建议
description: 提出新功能或对现有功能的改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明当前哪里不方便、缺少什么，或现有行为的不足。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的行为；如涉及玩法规则，请说明大致流程。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 其他可行的实现方式或不做改动的影响。
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前自查
      options:
        - label: 已搜索现有 Issue，确认没有重复建议
