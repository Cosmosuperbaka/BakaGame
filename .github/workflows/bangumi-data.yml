name: Update Bangumi Data

on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # 合成 fixture 自测，不依赖 dump；放在下载之前以便快速失败。
      - name: Test database builder
        run: python3 tools/test_build_bangumi_db.py
      - name: Download latest dump
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bangumi
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/bangumi/Archive/master/aux/latest.json" -o /tmp/bangumi/latest.json
          url=$(python3 -c 'import json; print(json.load(open("/tmp/bangumi/latest.json"))["browser_download_url"])')
          curl --fail --location --retry 3 "$url" -o /tmp/bangumi/dump.zip
          mkdir -p /tmp/bangumi/dump
          unzip -q /tmp/bangumi/dump.zip -d /tmp/bangumi/dump
      - name: Build SQLite databases
        run: python3 tools/build_bangumi_db.py /tmp/bangumi/dump Server/data
      - name: Commit generated data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Server/data/bangumi-*.sqlite
          git diff --cached --quiet || git commit -m "chore(Core): 更新番剧数据"
          git push
