name: Update Bangumi Data

on:
  # 北京时间每周一 05:00（UTC 周日 21:00）。刻意排在 CCB-TagsCI 的
  # weekly-tags-maintenance（北京时间周一 04:00）之后一小时，
  # 保证拿到的是当晚刚合并完用户反馈的 id_tags.js。
  schedule:
    - cron: "0 21 * * 0"
  # CCB-TagsCI 推完新标签后会主动派发这个事件，省掉最多一小时的等待。
  # 定时任务仍然保留：派发失败（例如 token 权限不足）时它是最低保障。
  repository_dispatch:
    types: [bangumi-tags-updated]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # 合成 fixture 自测，不依赖 dump 与网络；放在下载之前以便快速失败。
      - name: Test database builder
        run: python3 tools/test_build_bangumi_db.py
      - name: Download latest dump
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bangumi
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/bangumi/Archive/master/aux/latest.json" -o /tmp/bangumi/latest.json
          url=$(python3 -c 'import json; print(json.load(open("/tmp/bangumi/latest.json"))["browser_download_url"])')
          curl --fail --location --retry 3 "$url" -o /tmp/bangumi/dump.zip
          mkdir -p /tmp/bangumi/dump
          unzip -q /tmp/bangumi/dump.zip -d /tmp/bangumi/dump
      # 角色标签由 CCB-TagsCI 每周一 04:00（北京时间）产出并提交，仓库里不存快照。
      # 这里用 curl 而不是让构建脚本自己下载：与上面的 dump 下载保持同一套重试语义，
      # 并且下载到的字节数会留在 CI 日志里，便于追溯当晚用的是哪一版。
      - name: Download character tags
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/Cosmosuperbaka/CCB-TagsCI/master/outputs/id_tags.js" \
            -o /tmp/bangumi/id_tags.js
          wc -c /tmp/bangumi/id_tags.js
      - name: Build SQLite databases
        run: python3 tools/build_bangumi_db.py /tmp/bangumi/dump Server/data --tags /tmp/bangumi/id_tags.js
      # 数据不再提交进仓库（曾走 LFS，把 GitHub 带宽额度吃穿）：发布到 Cloudflare R2。
      # 上传顺序是刻意设计的：
      #   1. 先传版本化数据对象（文件名含 sha12，新文件名 = 新 CDN 缓存键，天然绕开旧缓存）；
      #   2. 再传 manifest.json（下游的一致性锚点；公开可读，ESA 上配置了禁缓存规则）；
      #   3. 最后清理旧版本对象——此时新链路已就绪，删旧不影响任何下游。
      - name: Publish to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          R2_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          aws configure set default.s3.addressing_style path
          # 1. 本地计算 sha256 并生成 manifest（版本化对象名只有这一处定义）
          python3 - <<'PYEOF'
          import hashlib, json, os, datetime
          def info(fid, fname, target):
              p = os.path.join("Server/data", fname)
              h = hashlib.sha256()
              with open(p, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 22), b""):
                      h.update(chunk)
              sha = h.hexdigest()
              return {"id": fid, "object": f"bangumi/bangumi-{fid}.{sha[:12]}.sqlite",
                      "sha256": sha, "size": os.path.getsize(p), "target": target}
          manifest = {
              "generatedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "files": [
                  # 单库：猜歌与 CCB 共用同一份数据集（see tools/build_bangumi_db.py）。
                  info("dataset", "bangumi.sqlite", "Server/data/bangumi.sqlite"),
              ],
          }
          with open("/tmp/bangumi-manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          PYEOF
          # 2. 上传版本化数据对象（幂等：同 sha 的对象重复上传结果相同）
          while read -r key local; do
            echo "上传 $local → s3://$R2_BUCKET/$key"
            aws --endpoint-url "$R2_ENDPOINT" s3 cp "$local" "s3://$R2_BUCKET/$key"
          done < <(jq -r '.files[] | "\(.object) Server/data/\(.target | split("/")[-1])"' /tmp/bangumi-manifest.json)
          # 3. manifest 最后传（先数据后清单，把「清单指向未就绪数据」的窗口压到零）
          aws --endpoint-url "$R2_ENDPOINT" s3 cp /tmp/bangumi-manifest.json \
            "s3://$R2_BUCKET/bangumi/manifest.json"
          # 4. 清理旧版本对象（保留当前两份数据与 manifest；桶不随每周发布膨胀）
          CURRENT="$(jq -r '.files[].object' /tmp/bangumi-manifest.json | tr '\n' ' ')bangumi/manifest.json "
          aws --endpoint-url "$R2_ENDPOINT" s3api list-objects-v2 \
            --bucket "$R2_BUCKET" --prefix "bangumi/" --query 'Contents[].Key' --output text \
            | tr '\t' '\n' | while read -r key; do
              [ -z "$key" ] && continue
              [ "$key" = "None" ] && continue
              if [[ "$CURRENT" != *" $key "* ]]; then
                echo "删除旧版本：$key"
                aws --endpoint-url "$R2_ENDPOINT" s3api delete-object \
                  --bucket "$R2_BUCKET" --key "$key"
              fi
            done
          cat /tmp/bangumi-manifest.json
