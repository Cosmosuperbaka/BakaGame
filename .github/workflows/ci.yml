name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 文档门禁：纯文档改动也要跑，无需安装依赖。
  docs:
    name: Docs Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 链接、锚点与 AGENTS.md 导航覆盖；规则见 Agents/Testing.md「验证范围」。
      - name: Check documentation links
        run: node scripts/CheckDocs.mjs

  # 路径探测：改了哪部分才跑对应 job，纯文档改动只跑上面的 docs。
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
      desktop: ${{ steps.filter.outputs.desktop }}
      android: ${{ steps.filter.outputs.android }}
      e2e: ${{ steps.filter.outputs.e2e }}
      knip: ${{ steps.filter.outputs.knip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'Server/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy.yml'
            client:
              - 'Client/*'
              - 'Client/!(e2e)/**'
              - 'Server/src/shared/**'
              - 'Server/scripts/ClientCiFilter.mjs'
              - '.github/workflows/ci.yml'
            # 桌面壳加载远程 URL，不内嵌前端产物，只有 Desktop/ 自身改动才需要打包。
            desktop:
              - 'Desktop/**'
              - '.github/workflows/ci.yml'
            # 安卓壳内嵌 Client 构建产物（P3.1），前端一改 APK 内容就变，因此 Client/ 也触发。
            android:
              - 'Mobile/**'
              - 'Client/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            # 静态分析：两端源码、根清单与锁文件、Knip 配置。
            knip:
              - 'Client/**'
              - 'Server/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'knip.jsonc'
              - '.github/workflows/ci.yml'
            e2e:
              - 'Client/**'
              - 'Server/**'
              - '.github/workflows/ci.yml'

  server:
    name: Server CI
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.server == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Server 测试全部使用隔离夹具（见 test/ 的 *Fixtures），不读 Server/data，
      # 因此不再下载数据集 —— 它只服务 E2E（下方 e2e 作业）与生产首启的基线补发。

      # Server 是 workspace 成员（包名 server），依赖由根级 pnpm-lock.yaml 单点锁定；
      # 安装用 pnpm，运行时仍是 Bun —— 根级 pnpm 不会替换 `bun test` 与 Bun 原生 API。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check server
        run: pnpm --filter server check

      - name: Lint server
        run: pnpm --filter server lint

      - name: Run server tests with coverage
        run: pnpm --filter server test:coverage

      # 冒烟走工作区固定版 bun（devDependency 钉的 1.4.2，与测试链、生产容器同一枚）：
      # pnpm 化后作业里不再有 Setup Bun，裸 `bun` 不在 PATH 上会以 127 直接退出。
      - name: Smoke test production server
        run: pnpm --filter server exec bun --no-env-file run scripts/ProductionSmoke.ts

      - name: Upload server coverage
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: server-coverage
          path: Server/coverage/
          retention-days: 14

  client:
    name: Client CI
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.client == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # jsdom 30.1.1 的 engines 为 ^22.22.2 || ^24.15.0 || >=26.0.0，
      # 用 pnpm 安装时 engines 不满足会硬失败，Node 必须 ≥22.22.2。
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify CI path filter fixtures
        working-directory: Client
        run: node --test ../Server/scripts/ClientCiFilter.mjs

      # 共享契约的解析边界：Server/src/shared 的裸导入必须能按「Client 独立安装」
      # 布局解析（ESA 构建正是这种布局），细节与背景见脚本头注释。
      - name: Verify shared dependency boundary
        working-directory: Client
        run: node scripts/check-shared-dependencies.mjs

      - name: Lint client
        run: pnpm --filter client lint

      - name: Run client tests with coverage
        run: pnpm --filter client test:coverage

      - name: Build client
        run: pnpm --filter client build

      - name: Smoke test production assets
        working-directory: Client
        run: node scripts/asset-smoke.mjs

      # 组件截图工具的构建冒烟：故事随组件改动失效时在 CI 暴露。
      - name: Build Storybook
        run: pnpm --filter client build-storybook

      - name: Upload client coverage
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: client-coverage
          path: Client/coverage/
          retention-days: 14

  # 桌面壳：远程 URL 的 Tauri v2 壳，必须在 CI 上真打包一次。
  # 图标只在打包阶段校验（cargo check/build 都不读），缺文件要到这里才炸，
  # 所以这个作业跑的是 `tauri build` 而不是 `cargo check`。
  desktop:
    name: Desktop Build (Tauri · Windows)
    runs-on: windows-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Desktop/src-tauri

      # CLI 由 npx 现取（预编译二进制，不占仓库依赖）；壳不在 pnpm workspace 成员内，
      # 因此这里不跑 pnpm install —— 它没有任何 JS 依赖。
      - name: Bundle the installer
        working-directory: Desktop
        run: npx --yes @tauri-apps/cli@^2 build --config src-tauri/tauri.conf.json

      - name: Upload installer
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: desktop-windows-installer
          path: Desktop/src-tauri/target/release/bundle/**
          retention-days: 14

  # 安卓壳：APK 内嵌 Client 构建产物，所以先把前端构建出来再喂 prepare-web。
  # 仓库里没有 Gradle wrapper jar（.gitignore 明确排除，见 Mobile/.gitignore），
  # 因此用系统 Gradle 构建，版本按 AGP 8.7.3 的要求钉死。
  android:
    name: Android Build (Capacitor)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.android == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client assets
        run: pnpm --filter client build

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # compileSdk 35 + buildToolsVersion 36.0.0 与 Mobile/android/app/build.gradle 保持一致
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;36.0.0" "platform-tools"

      # Mobile 不是 workspace 成员：依赖独立安装，产物注入 dist-web 并同步 versionName
      - name: Prepare embedded web assets
        working-directory: Mobile
        run: |
          npm install --no-audit --no-fund
          npm run prepare-web

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Assemble debug APK
        working-directory: Mobile/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: android-debug-apk
          path: Mobile/android/app/build/outputs/apk/**/*.apk
          retention-days: 14

  # 静态分析：未使用文件/依赖/导出。文件与依赖类问题阻断，导出/类型只提示（分级见 knip.jsonc）。
  knip:
    name: Knip
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.knip == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # Knip 会按仓库配置加载 Client 的 vite.config.ts（含构建期 SEO/资源插件），
      # 因此这里与 client 作业一样需要完整依赖，且不设置 NODE_ENV=production。
      - name: Check formatting
        run: pnpm format:check

      - name: Detect unused files, dependencies and exports
        run: pnpm knip --no-progress

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [changes, server, client]
    # 任一依赖真正失败则不跑；server/client 因路径过滤被跳过不算失败，照常执行。
    if: ${{ !cancelled() && needs.changes.outputs.e2e == 'true' && needs.server.result != 'failure' && needs.client.result != 'failure' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # E2E 要起真实服务端（角色检索/出题走真实 SQLite），从 R2 加速域取基线数据集并校验。
      - name: Download bangumi data
        run: |
          set -euo pipefail
          mkdir -p Server/data
          cd Server/data
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            -o manifest.json "$BANGUMI_DATA_CDN_BASE/files/bangumi/manifest.json"
          fetch_one() {
            id=$1 out=$2
            key=$(jq -r --arg id "$id" '.files[] | select(.id==$id) | .object' manifest.json)
            if [ -z "$key" ]; then
              echo "❌ manifest 缺少 $id 条目：E2E 需要基线数据集，请先发布到 R2（见 Agents/Deployment.md 数据分发）"
              exit 1
            fi
            sha=$(jq -r --arg id "$id" '.files[] | select(.id==$id) | .sha256' manifest.json)
            curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
              -o "$out" "$BANGUMI_DATA_CDN_BASE/files/$key"
            echo "$sha  $out" | sha256sum --check --strict -
          }
          fetch_one dataset bangumi.sqlite
        env:
          BANGUMI_DATA_CDN_BASE: ${{ secrets.BANGUMI_DATA_CDN_BASE }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: Client
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: pnpm --filter client test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: Client/playwright-report/
          retention-days: 14
