name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 路径探测：改了哪部分才跑对应 job，纯文档改动全部跳过。
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'Server/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy.yml'
            client:
              - 'Client/*'
              - 'Client/!(e2e)/**'
              - 'Server/src/shared/**'
              - 'Server/scripts/ClientCiFilter.mjs'
              - '.github/workflows/ci.yml'
            e2e:
              - 'Client/**'
              - 'Server/**'
              - '.github/workflows/ci.yml'

  server:
    name: Server CI
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.server == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 数据库不进 Git/LFS（曾把 LFS 带宽额度吃穿），从 R2 加速域取版本化实体。
      # manifest.json 是一致性锚点（公开可读，ESA 上配置了禁缓存规则）；
      # 文件名带 sha12 = 新缓存键，发布新版不会被 CDN 旧缓存污染。
      - name: Download bangumi data
        run: |
          set -euo pipefail
          mkdir -p Server/data
          cd Server/data
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            -o manifest.json "$BANGUMI_DATA_CDN_BASE/files/bangumi/manifest.json"
          fetch_one() {
            id=$1 out=$2
            key=$(jq -r --arg id "$id" '.files[] | select(.id==$id) | .object' manifest.json)
            sha=$(jq -r --arg id "$id" '.files[] | select(.id==$id) | .sha256' manifest.json)
            curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
              -o "$out" "$BANGUMI_DATA_CDN_BASE/files/$key"
            echo "$sha  $out" | sha256sum --check --strict -
          }
          fetch_one dataset bangumi.sqlite
        env:
          BANGUMI_DATA_CDN_BASE: ${{ secrets.BANGUMI_DATA_CDN_BASE }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install server dependencies
        working-directory: Server
        run: bun install --frozen-lockfile

      - name: Type check server
        working-directory: Server
        run: bun run check

      - name: Run server tests with coverage
        working-directory: Server
        run: bun run test:coverage

      - name: Smoke test production server
        working-directory: Server
        run: bun --no-env-file run scripts/ProductionSmoke.ts

      - name: Upload server coverage
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: server-coverage
          path: Server/coverage/
          retention-days: 14

  client:
    name: Client CI
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.client == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Install client dependencies
        working-directory: Client
        run: npm ci

      - name: Verify CI path filter fixtures
        working-directory: Client
        run: node --test ../Server/scripts/ClientCiFilter.mjs

      - name: Lint client
        working-directory: Client
        run: npm run lint

      - name: Run client tests with coverage
        working-directory: Client
        run: npm run test:coverage

      - name: Build client
        working-directory: Client
        run: npm run build

      - name: Smoke test production assets
        working-directory: Client
        run: node scripts/asset-smoke.mjs

      # 组件截图工具的构建冒烟：故事随组件改动失效时在 CI 暴露。
      - name: Build Storybook
        working-directory: Client
        run: npm run build-storybook

      - name: Upload client coverage
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: client-coverage
          path: Client/coverage/
          retention-days: 14

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [changes, server, client]
    # 任一依赖真正失败则不跑；server/client 因路径过滤被跳过不算失败，照常执行。
    if: ${{ !cancelled() && needs.changes.outputs.e2e == 'true' && needs.server.result != 'failure' && needs.client.result != 'failure' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 同 Server CI：E2E 要起真实服务端，需要从 R2 加速域取数据库实体并校验。
      - name: Download bangumi data
        run: |
          set -euo pipefail
          mkdir -p Server/data
          cd Server/data
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            -o manifest.json "$BANGUMI_DATA_CDN_BASE/files/bangumi/manifest.json"
          fetch_one() {
            id=$1 out=$2
            key=$(jq -r --arg id "$id" '.files[] | select(.id==$id) | .object' manifest.json)
            sha=$(jq -r --arg id "$id" '.files[] | select(.id==$id) | .sha256' manifest.json)
            curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
              -o "$out" "$BANGUMI_DATA_CDN_BASE/files/$key"
            echo "$sha  $out" | sha256sum --check --strict -
          }
          fetch_one dataset bangumi.sqlite
        env:
          BANGUMI_DATA_CDN_BASE: ${{ secrets.BANGUMI_DATA_CDN_BASE }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Install server dependencies
        working-directory: Server
        run: bun install --frozen-lockfile

      - name: Install client dependencies
        working-directory: Client
        run: npm ci

      - name: Install Playwright browsers
        working-directory: Client
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: Client
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: Client/playwright-report/
          retention-days: 14
