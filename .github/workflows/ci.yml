name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 路径探测：改了哪部分才跑对应 job，纯文档改动全部跳过。
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
      e2e: ${{ steps.filter.outputs.e2e }}
      tools: ${{ steps.filter.outputs.tools }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'Server/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy.yml'
              - '.github/workflows/bangumi-data.yml'
            client:
              - 'Client/*'
              - 'Client/!(e2e)/**'
              - 'Server/src/shared/**'
              - 'Server/scripts/ClientCiFilter.mjs'
              - '.github/workflows/ci.yml'
            e2e:
              - 'Client/**'
              - 'Server/**'
              - '.github/workflows/ci.yml'

            tools:
              - 'tools/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/bangumi-data.yml'

  tools:
    name: Python Builder Fixtures
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.tools == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Test database builder without downloads
        run: python3 -B tools/test_build_bangumi_db.py

  server:
    name: Server CI
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.server == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install server dependencies
        working-directory: Server
        run: bun install --frozen-lockfile

      - name: Type check server
        working-directory: Server
        run: bun run check

      - name: Run server tests with coverage
        working-directory: Server
        run: bun run test:coverage

      - name: Smoke test production server
        working-directory: Server
        run: bun --no-env-file run scripts/ProductionSmoke.ts

      - name: Upload server coverage
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: server-coverage
          path: Server/coverage/
          retention-days: 14

  client:
    name: Client CI
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.client == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Install client dependencies
        working-directory: Client
        run: npm ci

      - name: Verify CI path filter fixtures
        working-directory: Client
        run: node --test ../Server/scripts/ClientCiFilter.mjs

      - name: Lint client
        working-directory: Client
        run: npm run lint

      - name: Run client tests with coverage
        working-directory: Client
        run: npm run test:coverage

      - name: Build client
        working-directory: Client
        run: npm run build

      - name: Smoke test production assets
        working-directory: Client
        run: node scripts/asset-smoke.mjs

      # 组件截图工具的构建冒烟：故事随组件改动失效时在 CI 暴露。
      - name: Build Storybook
        working-directory: Client
        run: npm run build-storybook

      - name: Upload client coverage
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: client-coverage
          path: Client/coverage/
          retention-days: 14

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [changes, server, client]
    # 任一依赖真正失败则不跑；server/client 因路径过滤被跳过不算失败，照常执行。
    if: ${{ !cancelled() && needs.changes.outputs.e2e == 'true' && needs.server.result != 'failure' && needs.client.result != 'failure' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Install server dependencies
        working-directory: Server
        run: bun install --frozen-lockfile

      - name: Install client dependencies
        working-directory: Client
        run: npm ci

      - name: Install Playwright browsers
        working-directory: Client
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: Client
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: Client/playwright-report/
          retention-days: 14
