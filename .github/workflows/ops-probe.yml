name: Ops Probe

# 一次性只读诊断（临时文件，诊断完成后移除）：
# v3 目的：验证「容器 node_modules 的 bun」修复路径、Meilisearch 可达性、MAINTENANCE_TOKEN 现状。
# 不修改任何状态；不打印环境变量值（仅名称/键名）、不打印容器日志内容（仅计数）、不打印 SSH 主机。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe Server
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
          key: ${{ secrets.DEPLOY_KEY }}
          passphrase: ${{ secrets.DEPLOY_PASSPHRASE || secrets.DEPLOY_KEY_PASSPHRASE || '' }}
          command_timeout: 2m
          script_stop: false
          script: |
            set -euo pipefail
            PROBE_SH=$(mktemp /tmp/bakagame-probe.XXXXXX.sh)
            trap 'rm -f "$PROBE_SH"' EXIT
            cat > "$PROBE_SH" <<'BAKA_PROBE_EOF'
            set -uo pipefail

            echo "===== 0. 宿主工具 ====="
            command -v sudo timeout docker git curl || true

            echo "===== 1. 容器总览 ====="
            sudo docker ps -a --filter name=BakaGame --format 'id={{.ID}} image={{.Image}} status={{.Status}}'; echo "rc=$?"

            echo "===== 2. inspect 关键字段 ====="
            sudo docker inspect BakaGame --format 'NetworkMode={{.HostConfig.NetworkMode}}'
            sudo docker inspect BakaGame --format 'Created={{.Created}}'
            sudo docker inspect BakaGame --format 'Cmd={{json .Config.Cmd}}'
            sudo docker inspect BakaGame --format 'WorkingDir={{.Config.WorkingDir}}'
            echo "--- 容器环境变量名（仅名称，不含值）---"
            sudo docker inspect BakaGame --format '{{range .Config.Env}}{{println .}}{{end}}' | cut -d= -f1 | grep -E '^[A-Z_]+$' | sort

            echo "===== 3. exec 基础 + stdin ====="
            sudo docker exec BakaGame sh -c 'id -un; pwd'; echo "rc=$?"
            printf 'stdin-echo-ok\n' | sudo docker exec -i BakaGame sh -c 'cat'; echo "rc=$?"

            echo "===== 4. 容器内运行时（PATH / node_modules / node）====="
            sudo docker exec BakaGame sh -c 'command -v bun || echo "(PATH 无 bun)"; command -v node; node --version'; echo "rc=$?"
            sudo docker exec BakaGame sh -c 'ls -la /app/node_modules/.bin/ | grep -i bun || echo "(无 .bin/bun)"'; echo "rc=$?"
            sudo docker exec BakaGame sh -c '/app/node_modules/.bin/bun --version'; echo "rc=$?"
            sudo docker exec BakaGame sh -c 'ls -la /app/node_modules/bun/bin/ 2>/dev/null || echo "(无 bun 包目录)"'; echo "rc=$?"

            echo "===== 5. 修复复刻：release 元数据（容器 node_modules 的 bun）====="
            cd /BakaGame
            COMMIT=$(git rev-parse HEAD)
            REL_OUT=$(mktemp); REL_ERR=$(mktemp)
            S=$(date +%s%N)
            sudo timeout 3s docker exec -i BakaGame /app/node_modules/.bin/bun --no-env-file - "$COMMIT" "$(cat Client/src/data/changelog.json)" < Server/src/infrastructure/Release.ts > "$REL_OUT" 2> "$REL_ERR"
            echo "rc=$?  耗时 $(( ($(date +%s%N) - S) / 1000000 )) ms"
            echo "--- stdout ($(wc -c < "$REL_OUT") 字节):"; head -c 400 "$REL_OUT"; echo ""
            echo "--- stderr ($(wc -c < "$REL_ERR") 字节):"; head -c 400 "$REL_ERR"; echo ""
            rm -f "$REL_OUT" "$REL_ERR"

            echo "===== 6. stdin 机制复刻（notify/probe 同机制，含参数透传与 loopback fetch）====="
            printf 'console.log("stdin-ok", JSON.stringify(process.argv.slice(2)))' | sudo docker exec -i BakaGame /app/node_modules/.bin/bun --no-env-file - AAA BBB; echo "rc=$?"
            printf 'const r = await fetch("http://127.0.0.1:4850/health", { signal: AbortSignal.timeout(2000) }); console.log("fetch-ok", r.status);' | sudo docker exec -i BakaGame /app/node_modules/.bin/bun --no-env-file -; echo "rc=$?"

            echo "===== 7. 服务器工作区现状 ====="
            git -C /BakaGame rev-parse HEAD; echo "rc=$?"
            git -C /BakaGame status --short | head -8
            ls -la /BakaGame/.deploy-stash 2>/dev/null | head -8
            ls -la /BakaGame/Server/data 2>/dev/null | head -8
            ls -la /BakaGame/Server/build 2>/dev/null | head -6

            echo "===== 8. 令牌与容器入口线索 ====="
            sudo docker exec BakaGame sh -c '[ -n "${MAINTENANCE_TOKEN:-}" ] && echo "token-present" || echo "token-absent"'; echo "rc=$?"
            echo "--- /app/.env 键名（仅键名）---"
            sudo docker exec BakaGame sh -c 'grep -oE "^[A-Z_]+=" /app/.env 2>/dev/null | sort || true'; echo "rc=$?"
            echo "--- run.sh 结构关键字（不含值）---"
            sudo grep -oE '^[[:space:]]*(export )?[A-Z_]{3,}=|^[[:space:]]*(cd|source|exec|set) |bun (run|install)|npm (ci|install|start|run)' /opt/1panel/runtime/node/BakaGame/run.sh 2>/dev/null | sort | uniq -c || echo "(run.sh 不可读)"

            echo "===== 9. Meilisearch 可达性 ====="
            (curl -sS -m 2 -o /dev/null -w 'host-7700: HTTP %{http_code}\n' http://127.0.0.1:7700/health) 2>&1 || echo "host-7700: unreachable"
            sudo docker exec BakaGame node -e "fetch('http://127.0.0.1:7700/health',{signal:AbortSignal.timeout(2000)}).then(async r=>console.log('container-7700: HTTP',r.status,(await r.text()).slice(0,60))).catch(e=>console.log('container-7700: unreachable',e.name))"
            echo "容器总数: $(sudo docker ps -a --format '{{.Names}}' | wc -l)"
            sudo docker ps -a --format '{{.Names}}' | grep -iE 'meili|search' || echo "(无名字含 meili/search 的容器)"

            echo "===== 10. 线上服务健康与错误计数 ====="
            for p in /health /livez /readyz; do
              code=$(curl -sS -m 3 -o /dev/null -w '%{http_code}' "http://127.0.0.1:4850$p" 2>/dev/null || true)
              echo "$p -> HTTP ${code:-conn-failed}"
            done
            LOG_TAIL=$(sudo docker logs --tail 500 BakaGame 2>&1)
            echo "日志行数: $(printf '%s\n' "$LOG_TAIL" | wc -l)"
            echo "no-such-table 计数: $(printf '%s\n' "$LOG_TAIL" | grep -c 'no such table' || true)"
            echo "corrupt 计数: $(printf '%s\n' "$LOG_TAIL" | grep -ci 'malformed\|corrupt' || true)"
            echo "meili/7700 提及计数: $(printf '%s\n' "$LOG_TAIL" | grep -ci 'meili\|7700' || true)"

            echo "===== DONE ====="
            BAKA_PROBE_EOF
            bash "$PROBE_SH"
