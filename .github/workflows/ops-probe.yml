name: Ops Probe

# 一次性只读诊断（临时文件，诊断完成后移除）：
# v5 目的：核验发布证据（release.json / Sentry 警告）、Bangumi worker 报错计数、
#          容器环境键名与 Meilisearch 索引状态（确认索引重建与搜索恢复）。
# 不修改任何状态；不打印环境变量值（仅名称/键名）、不打印容器日志内容（仅计数）、不打印 SSH 主机。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe Server
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
          key: ${{ secrets.DEPLOY_KEY }}
          passphrase: ${{ secrets.DEPLOY_PASSPHRASE || secrets.DEPLOY_KEY_PASSPHRASE || '' }}
          command_timeout: 2m
          script_stop: false
          script: |
            set -euo pipefail
            PROBE_SH=$(mktemp /tmp/bakagame-probe.XXXXXX.sh)
            trap 'rm -f "$PROBE_SH"' EXIT
            cat > "$PROBE_SH" <<'BAKA_PROBE_EOF'
            set -uo pipefail

            echo "===== 1. 容器总览 ====="
            sudo docker ps -a --filter name=BakaGame --format 'BakaGame: id={{.ID}} image={{.Image}} status={{.Status}}'
            MEILI=$(sudo docker ps -a --format '{{.Names}}' | grep -iE 'meili' | head -1 || true)
            echo "MEILI=$MEILI"

            echo "===== 2. 发布证据与 Sentry 警告核验 ====="
            echo "--- 容器内 /app/build/release.json ---"
            sudo docker exec BakaGame cat /app/build/release.json 2>&1 || echo "(读取失败或不存在)"
            STARTED=$(sudo docker inspect -f '{{.State.StartedAt}}' BakaGame)
            echo "容器启动于: $STARTED"
            echo "近 5000 行「发布证据缺失」累计: $(sudo docker logs --tail 5000 BakaGame 2>&1 | grep -c '发布证据缺失' || true)"
            echo "本次启动以来「发布证据缺失」: $(sudo docker logs --since "$STARTED" BakaGame 2>&1 | grep -c '发布证据缺失' || true)"

            echo "===== 3. Bangumi worker 错误计数 ====="
            echo "近 5000 行「Bangumi worker query failed」累计: $(sudo docker logs --tail 5000 BakaGame 2>&1 | grep -c 'Bangumi worker query failed' || true)"
            echo "本次启动以来「Bangumi worker query failed」: $(sudo docker logs --since "$STARTED" BakaGame 2>&1 | grep -c 'Bangumi worker query failed' || true)"
            echo "本次启动以来「no such column」: $(sudo docker logs --since "$STARTED" BakaGame 2>&1 | grep -c 'no such column' || true)"

            echo "===== 4. 容器环境键名（仅名称）====="
            sudo docker inspect BakaGame --format '{{range .Config.Env}}{{println .}}{{end}}' | cut -d= -f1 | grep -E '^(MEILISEARCH|MAINTENANCE|DEPLOYMENT)' | sort

            echo "===== 5. Meilisearch 索引状态（宿主侧，带鉴权）====="
            if [ -n "$MEILI" ]; then
              KEY=$(sudo docker inspect "$MEILI" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^MEILI_MASTER_KEY=//p')
              AUTH=()
              [ -n "$KEY" ] && AUTH=(-H "Authorization: Bearer $KEY")
              echo "--- 索引列表（前 600 字节）---"
              curl -sS -m 4 "${AUTH[@]}" http://127.0.0.1:7700/indexes | head -c 600
              echo ""
              for idx in bangumi_subjects bangumi_search_metadata ccb_subjects; do
                echo "--- $idx stats ---"
                curl -sS -m 4 "${AUTH[@]}" "http://127.0.0.1:7700/indexes/$idx/stats" | head -c 300
                echo ""
              done
            fi

            echo "===== 6. 服务健康（宿主侧 4850）====="
            for p in /health /livez /readyz; do
              code=$(curl -sS -m 3 -o /dev/null -w '%{http_code}' "http://127.0.0.1:4850$p" 2>/dev/null || true)
              echo "$p -> HTTP ${code:-conn-failed}"
            done

            echo "===== 7. 容器内 → Meili 可达（by-container-name）====="
            if [ -n "$MEILI" ]; then
              out=$(sudo docker exec BakaGame node -e "fetch('http://$MEILI:7700/health',{signal:AbortSignal.timeout(2500)}).then(async r=>console.log('HTTP '+r.status+' '+((await r.text()).slice(0,60)))).catch(e=>console.log('FAIL '+((e.cause&&(e.cause.code||e.cause.message))||e.name)))" 2>&1) || true
              echo "by-container-name => $out"
            fi

            echo "===== DONE ====="
            BAKA_PROBE_EOF
            bash "$PROBE_SH"
