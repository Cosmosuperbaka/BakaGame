name: Deploy Backend

# 部署不再自带全量测试：服务端类型检查 + 全量测试只在 CI 跑一次，这里消费 CI 的结论。
# 触发条件：CI 全绿，且其中「Server CI」确实执行过（而非被路径过滤跳过）。
# 手动 dispatch 显式选择 CI run，仍消费同一获验 SHA，不绕过门禁。
# 部署脚本自身变更也要生效：ci.yml 的 server 过滤包含本文件，改动后会走一次
# CI → workflow_run → 部署 的链路自动落地。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "已成功完成的 main push CI run ID（必须包含成功 Server CI）"
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  # 部署门禁：CI 失败（含 E2E 失败）不部署；本次推送未改服务端（Server CI 被跳过）不部署。
  gate:
    name: Deployment Gate
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      revision: ${{ steps.decide.outputs.revision }}
      run_id: ${{ steps.decide.outputs.run_id }}
    steps:
      # 使用当前工作流修订的门禁实现，绝不执行候选 CI 提交里的脚本。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Decide whether to deploy
        id: decide
        uses: actions/github-script@v7
        env:
          SELECTED_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
        with:
          script: |
            const { deploymentRevision } = await import(`${process.env.GITHUB_WORKSPACE}/Server/scripts/DeploymentGate.mjs`);
            const raw = process.env.SELECTED_RUN_ID;
            if (!/^[1-9][0-9]*$/.test(raw) || !Number.isSafeInteger(Number(raw))) throw new Error('Invalid CI run ID');
            const run_id = Number(raw);
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id });
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { ...context.repo, run_id, filter: 'latest', per_page: 100 });
            const revision = deploymentRevision(run, jobs, `${context.repo.owner}/${context.repo.repo}`);
            core.setOutput('deploy', revision ? 'true' : 'false');
            if (!revision) {
              if (context.eventName === 'workflow_dispatch') throw new Error('Selected CI run is not deployable');
              core.info('CI run is not deployable');
              return;
            }
            core.setOutput('revision', revision);
            core.setOutput('run_id', raw);
            core.info(`Deploy verified CI run ${raw}, SHA ${revision}`);

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [gate]
    # 生产部署硬超时：3 分钟。
    timeout-minutes: 3
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.gate.outputs.deploy == 'true' }}
    steps:
      # 从 R2 加速域读取数据清单（公开、ESA 禁缓存），把版本化 URL / sha256 / size
      # 解析后经 SSH envs 传给部署脚本——生产机全程不接触任何 R2 凭证，
      # 只按一次性拼好的公开 URL 下载版本化对象。
      - name: Resolve bangumi data manifest
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            -o /tmp/bangumi-manifest.json \
            "$BANGUMI_DATA_CDN_BASE/files/bangumi/manifest.json"
          resolve_one() {
            id=$1 var=$2
            key=$(jq -r --arg id "$id" '.files[] | select(.id==$id) | .object' /tmp/bangumi-manifest.json)
            sha=$(jq -r --arg id "$id" '.files[] | select(.id==$id) | .sha256' /tmp/bangumi-manifest.json)
            size=$(jq -r --arg id "$id" '.files[] | select(.id==$id) | .size' /tmp/bangumi-manifest.json)
            [[ "$key" == bangumi/* && "$sha" =~ ^[0-9a-f]{64}$ && "$size" =~ ^[1-9][0-9]*$ ]] \
              || { echo "❌ manifest 条目异常：$id"; exit 1; }
            echo "${var}_URL=$BANGUMI_DATA_CDN_BASE/files/$key" >> "$GITHUB_ENV"
            echo "${var}_SHA=$sha" >> "$GITHUB_ENV"
            echo "${var}_SIZE=$size" >> "$GITHUB_ENV"
          }
          resolve_one dataset BG_DATA
        env:
          BANGUMI_DATA_CDN_BASE: ${{ secrets.BANGUMI_DATA_CDN_BASE }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_REV: ${{ needs.gate.outputs.revision }}
          VERIFIED_RUN_ID: ${{ needs.gate.outputs.run_id }}
        with:
          envs: DEPLOY_REV,VERIFIED_RUN_ID,BG_DATA_URL,BG_DATA_SHA,BG_DATA_SIZE
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
          key: ${{ secrets.DEPLOY_KEY }}
          passphrase: ${{ secrets.DEPLOY_PASSPHRASE || secrets.DEPLOY_KEY_PASSPHRASE || '' }}
          command_timeout: 3m
          # 绝不能开 script_stop：drone-ssh 会对脚本逐行改写、在每条命令后注入
          # DRONE_SSH_PREV_COMMAND_EXIT_CODE 检查，任何合法为假的 if/&&（状态码 1）
          # 都会被当成失败直接 exit 1，多行命令也会被截断。
          # 失败即停由脚本自己的 `set -euo pipefail` 负责。
          script_stop: false
          script: |
            set -euo pipefail
            # drone-ssh 把整段脚本经 stdin 喂给远端 shell。为彻底排除
            # "脚本内命令读走/吃掉剩余脚本"这一类问题，把真正的部署逻辑
            # 落成服务器上的临时文件再用 bash 执行 —— 内层脚本从文件读，
            # 与 stdin 完全无关，trap / set -e / read 的行为都可控。
            DEPLOY_SH=$(mktemp /tmp/bakagame-deploy.XXXXXX.sh)
            trap 'rm -f "$DEPLOY_SH"' EXIT
            cat > "$DEPLOY_SH" <<'BAKA_DEPLOY_EOF'
            set -euo pipefail

            REPO="Cosmosuperbaka/BakaGame"
            : "${DEPLOY_REV:?Missing verified SHA}"
            [[ "$DEPLOY_REV" =~ ^[0-9a-f]{40}$ ]] || exit 1
            [[ "$VERIFIED_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
            REF="$DEPLOY_REV"
            echo "发布获验 CI run=$VERIFIED_RUN_ID SHA=$DEPLOY_REV"
            DB_FILES="Server/data/bangumi.sqlite"
            # 数据库实体文件中转目录：与仓库同盘，mv 为原子改名，不产生拷贝开销。
            STASH="/BakaGame/.deploy-stash"
            # 单文件并行分片数。
            SPLIT=8
            # 下载绝对截止时间（相对脚本开始的秒数）。到点即干净失败，
            # 为后面的容器重启 + 健康检查留足余量，确保不会撞上 3 分钟硬超时。
            DL_DEADLINE=115
            # 数据库分发源：R2 加速域。版本化 URL / sha256 / size 由 runner 从
            # manifest（公开、禁缓存）解析后经 SSH envs 传入（BG_*），生产机
            # 不持有任何 R2 凭证。这里只做格式校验，防环境变量注入。
            for v in BG_DATA_URL BG_DATA_SHA BG_DATA_SIZE; do
              if [ -z "${!v:-}" ]; then
                echo "❌ 缺少数据分发环境变量：$v"
                exit 1
              fi
            done
            check_url()  { [[ "$1" =~ ^https://[A-Za-z0-9.:/_-]+$ ]] || { echo "❌ 非法数据 URL：$1"; exit 1; }; }
            check_sha()  { [[ "$1" =~ ^[0-9a-f]{64}$ ]] || { echo "❌ 非法 sha256：$1"; exit 1; }; }
            check_size() { [[ "$1" =~ ^[1-9][0-9]*$ ]] || { echo "❌ 非法数据大小：$1"; exit 1; }; }
            check_url "$BG_DATA_URL"; check_sha "$BG_DATA_SHA"; check_size "$BG_DATA_SIZE"

            T0=$(date +%s)
            say() { echo "[$(( $(date +%s) - T0 ))s] $*"; }
            elapsed() { echo $(( $(date +%s) - T0 )); }

            # 按 basename 映射到 runner 传入的 BG_* 变量。
            # $1 = 文件名（不带路径）
            data_var() {
              case "$1" in
                bangumi.sqlite) echo DATA ;;
                *) echo "" ;;
              esac
            }
            want_url()  { eval "echo \"\$BG_$(data_var "$1")_URL\""; }
            want_sha()  { eval "echo \"\$BG_$(data_var "$1")_SHA\""; }
            want_size() { eval "echo \"\$BG_$(data_var "$1")_SIZE\""; }

            restore_cache() {
              for f in $DB_FILES; do
                c="$STASH/$(basename "$f")"
                if [ -f "$c" ]; then
                  if [ ! -s "$f" ] || [ "$(head -c 15 "$f" 2>/dev/null)" != "SQLite format 3" ]; then
                    mv -f "$c" "$f" 2>/dev/null || true
                  fi
                fi
              done
            }

            RESTART_STARTED=false
            on_exit() {
              rc=$?
              if [ "$rc" -ne 0 ]; then
                if [ "$RESTART_STARTED" = false ]; then
                  echo "==> 重启前部署失败（退出码 $rc），恢复本地数据库文件，线上进程未重启"
                  restore_cache
                else
                  echo "==> 重启后验收失败（退出码 $rc），保留现场与暂存数据，需运维恢复"
                fi
              fi
              if [ -n "${RELEASE_TMP:-}" ]; then rm -f "$RELEASE_TMP"; fi
              # 注意：.parts.* 必须保留 —— 被强杀/超时的运行要靠它断点续传。
              rm -rf "$STASH"/.probe "$STASH"/.merged.* 2>/dev/null || true
            }
            trap on_exit EXIT

            # 任何非预期失败都带行号报出来：一次部署只有 3 分钟，没有第二次机会慢慢猜。
            if [ -n "${BASH_VERSION:-}" ]; then
              set -E
              trap 'echo "❌ 脚本第 ${LINENO} 行执行失败：$BASH_COMMAND"' ERR
            fi

            cd /BakaGame
            say "开始部署 BakaGame 后端"

            # ---------- 0. 环境自检 ----------
            for t in git curl awk sort tr wc head basename sha256sum date grep cp mv rm mktemp cat chmod timeout; do
              if ! command -v "$t" >/dev/null 2>&1; then
                echo "❌ 生产机缺少必需命令：$t"
                exit 1
              fi
            done

            # ---------- 1. 代码同步（数据库实体不进 Git，由本脚本从 R2 取） ----------
            # 工作流已串行化（concurrency），上一次中断遗留的锁文件必然是陈旧的。
            if [ -f .git/index.lock ]; then
              say "清理上一次中断遗留的 .git/index.lock"
              rm -f .git/index.lock
            fi

            # 数据库已退出 Git/LFS；这里保留 SKIP_SMUDGE 作为过渡期双保险，
            # 防止服务器上旧克隆的残留 LFS 配置在 reset 时去拉实体。
            export GIT_LFS_SKIP_SMUDGE=1
            git config --local filter.lfs.required false

            # 把已就位的实体文件挪出工作区（mv 是原子改名）。
            # 血的教训：工作区里可能躺着指针文本（上一次失败留下的），绝不能用
            # mv -f 盲目覆盖暂存区 —— 那会把唯一的真实数据库覆盖成 133 字节指针。
            # 只有"工作区是有效 SQLite 且暂存区没有有效副本"时才搬过去。
            mkdir -p "$STASH"
            for f in $DB_FILES; do
              b=$(basename "$f")
              c="$STASH/$b"
              if [ -f "$f" ] && [ "$(head -c 15 "$f" 2>/dev/null)" = "SQLite format 3" ]; then
                if [ ! -f "$c" ] || [ "$(head -c 15 "$c" 2>/dev/null)" != "SQLite format 3" ]; then
                  mv -f "$f" "$c"
                  say "暂存实体文件：$f"
                else
                  # 两份都是有效实体：上次部署在停机预告前中止时，工作区副本可能已是下载
                  # 校验过的目标数据、而暂存区仍是陈旧版本——此时取信工作区。否则重跑会
                  # 丢掉已下载的数据、白下三百多兆。
                  stash_sha=$(sha256sum "$c"); stash_sha=${stash_sha%% *}
                  work_sha=$(sha256sum "$f"); work_sha=${work_sha%% *}
                  if [ "$stash_sha" != "$(want_sha "$b")" ] && [ "$work_sha" = "$(want_sha "$b")" ]; then
                    mv -f "$f" "$c"
                    say "暂存副本已过期，改用工作区目标数据：$f"
                  else
                    rm -f "$f"
                  fi
                fi
              elif [ -f "$f" ]; then
                say "工作区是 LFS 指针文本，丢弃：$f"
                rm -f "$f"
              fi
            done

            say "拉取远端代码"
            git fetch --no-tags origin "$REF"
            git reset --hard "$DEPLOY_REV" >/dev/null
            COMMIT=$(git rev-parse HEAD)
            [ "$COMMIT" = "$DEPLOY_REV" ] || exit 1
            say "已对齐至 $COMMIT"

            # reset 后工作区里不应再有数据库文件（数据已不进 Git）。
            # 一致性锚点（版本化 URL / sha256 / size）由 runner 从 manifest 解析，
            # 已随 SSH envs 传入并在脚本开头做过格式校验，这里直接可用。

            # ---------- 2. 数据库：校验和未变化则零网络复用，变化才下载 ----------
            PENDING=""
            for f in $DB_FILES; do
              b=$(basename "$f")
              cached="$STASH/$b"
              want=$(want_sha "$b")
              if [ -z "$want" ]; then
                echo "❌ 数据分发变量缺少条目：$b"
                exit 1
              fi
              if [ -f "$cached" ] && [ "$(head -c 15 "$cached")" = "SQLite format 3" ]; then
                hash=$(sha256sum "$cached"); hash=${hash%% *}
                if [ "$hash" = "$want" ]; then
                  mv -f "$cached" "$f"
                  say "复用本地数据库（校验和未变化）：$f"
                  continue
                fi
                say "本地数据库已过期：$f（本地 $(printf '%.12s' "$hash") → 目标 $(printf '%.12s' "$want")）"
              else
                say "本地没有可复用的数据库：$f"
              fi
              PENDING="$PENDING $f"
            done

            if [ -n "$PENDING" ]; then
              say "需下载数据：$PENDING"

              # 多分片并行下载：单一 R2 源（CF anycast），重试内建；
              # 每个分片严格受全局预算约束，保证不会拖爆 3 分钟硬超时。
              DL_END=$(( T0 + DL_DEADLINE ))

              fetch_file() {
                f="$1"
                b=$(basename "$f")
                want=$(want_sha "$b")
                if [ -z "$want" ]; then
                  echo "❌ 无法读取数据校验和：$f"
                  return 1
                fi
                size=$(want_size "$b")
                case "$size" in
                  ''|*[!0-9]*) echo "❌ 无法获取远端大小：$f"; return 1 ;;
                esac
                say "  $b：$size 字节，目标 sha256 $(printf '%.12s' "$want")…"
                # 注意：两个文件是并行下载的，临时路径必须按文件名取唯一值。
                # bash 的 $$ 在子 shell 中仍是父进程 PID，不能用来做区分。
                # 分片目录额外带上目标校验和前缀：断点续传只对同一个对象有意义。
                parts="$STASH/.parts.$b.${want:0:12}"
                merged="$STASH/.merged.$b"
                rm -f "$merged"; mkdir -p "$parts"
                chunk=$(( (size + SPLIT - 1) / SPLIT ))
                i=0
                while [ "$i" -lt "$SPLIT" ]; do
                  start=$(( i * chunk )); end=$(( start + chunk - 1 ))
                  if [ "$end" -ge "$size" ]; then end=$(( size - 1 )); fi
                  want_len=$(( end - start + 1 ))
                  (
                    # 断点续传：上次运行已拿满长度的分片直接复用（整体 sha256 会兜底校验）
                    if [ -f "$parts/$i" ] && [ "$(wc -c < "$parts/$i" | tr -d ' ')" = "$want_len" ]; then
                      exit 0
                    fi
                    cap=$(( DL_END - $(date +%s) ))
                    if [ "$cap" -lt 8 ]; then exit 1; fi
                    if [ "$cap" -gt 60 ]; then cap=60; fi
                    # --speed-limit/--speed-time：连接空转不出流量时快速放弃；
                    # --retry 应对偶发 5xx/429/超时。
                    if curl -sS -L --fail --connect-timeout 6 --max-time "$cap" \
                         --retry 2 --retry-delay 1 \
                         --speed-limit 32768 --speed-time 20 \
                         -r "$start-$end" -o "$parts/$i" "$(want_url "$b")"; then
                      # 逐分片长度自校验：防住忽略 Range 直接回整文件的中间层。
                      if [ "$(wc -c < "$parts/$i" | tr -d ' ')" = "$want_len" ]; then
                        exit 0
                      fi
                    fi
                    exit 1
                  ) &
                  i=$(( i + 1 ))
                done
                wait || true

                : > "$merged"
                i=0
                complete=true
                while [ "$i" -lt "$SPLIT" ]; do
                  if [ ! -s "$parts/$i" ]; then complete=false; fi
                  cat "$parts/$i" >> "$merged" 2>/dev/null || complete=false
                  i=$(( i + 1 ))
                done
                got=$(wc -c < "$merged" | tr -d ' ')
                if [ "$complete" = true ] && [ "$got" = "$size" ] \
                   && [ "$(sha256sum "$merged" | awk '{print $1}')" = "$want" ]; then
                  mv -f "$merged" "$f"
                  rm -rf "$parts"
                  return 0
                fi
                echo "    ✗ 下载校验失败：$f（期望 $size 字节，实际 $got 字节）"
                rm -rf "$parts" "$merged"
                return 1
              }

              pids=""
              for f in $PENDING; do
                fetch_file "$f" &
                pids="$pids $!"
              done
              dl_ok=true
              for p in $pids; do
                wait "$p" || dl_ok=false
              done
              if [ "$dl_ok" != true ]; then
                echo "❌ 数据库下载失败，本次部署中止"
                exit 1
              fi
              say "数据库下载完成"
            fi

            # ---------- 3. 落盘校验 ----------
            for f in $DB_FILES; do
              b=$(basename "$f")
              want=$(want_sha "$b")
              hash=$(sha256sum "$f"); hash=${hash%% *}
              if [ -z "$want" ] || [ "$hash" != "$want" ]; then
                echo "❌ 数据库校验失败：$f"
                exit 1
              fi
              say "校验通过：$f"
            done

            # ---------- Release 元数据准备（预算 3 秒；bun 取自容器 node_modules，镜像内无 PATH bun） ----------
            say "生成获验修订的无秘密 release 元数据"
            mkdir -p Server/build
            RELEASE_TMP=$(mktemp Server/build/.release.XXXXXX)
            if ! sudo timeout 3s docker exec -i BakaGame /app/node_modules/.bin/bun --no-env-file - "$COMMIT" "$(cat Client/src/data/changelog.json)" \
              < Server/src/infrastructure/Release.ts > "$RELEASE_TMP"; then
              echo "❌ Release 元数据生成失败，本次发布中止且不重启容器"
              head -c 400 "$RELEASE_TMP" 2>/dev/null || true
              rm -f "$RELEASE_TMP"
              exit 1
            fi
            if [ ! -s "$RELEASE_TMP" ] || ! grep -qF "\"revision\":\"$COMMIT\"" "$RELEASE_TMP"; then
              echo "❌ Release 元数据内容校验失败（空输出或修订不符），本次发布中止且不重启容器"
              head -c 400 "$RELEASE_TMP" 2>/dev/null || true
              rm -f "$RELEASE_TMP"
              exit 1
            fi
            chmod 644 "$RELEASE_TMP"
            mv -f "$RELEASE_TMP" Server/build/release.json
            RELEASE_TMP=""
            say "Release 元数据已原子写入"
            # ---------- Release 元数据准备结束 ----------

            # ---------- 4. 停机预告与客户端排空 (Graceful Drain) ----------
            say "向在线玩家广播停机维护通知并摘除就绪流量"
            # token 只在容器内部读取，不进入 SSH 参数或日志；缺失/失败禁止重启。
            if ! sudo docker exec -i BakaGame /app/node_modules/.bin/bun --no-env-file - < Server/scripts/DeploymentNotify.ts; then
              echo "❌ 维护预通知未成功，本次发布中止且不重启容器"
              exit 1
            fi
            say "等待客户端接收通知与平滑退回大厅 (3s)"
            sleep 3

            # ---------- 5. 重启后端容器（入口自带依赖同步与环境初始化） ----------
            say "重启 BakaGame 容器"
            RESTART_STARTED=true
            sudo docker restart BakaGame

            # ---------- 6. 业务就绪（总预算 30 秒，无房间创建） ----------
            say "验证存储就绪及三个协议订阅 ACK"
            # stdin 传入此 SHA 的纯探针，避免猜测容器挂载路径；不加载应用或 .env。
            if ! sudo docker exec -i BakaGame /app/node_modules/.bin/bun --no-env-file - < Server/scripts/DeploymentProbe.ts; then
              echo "❌ 重启后业务就绪失败；不自动二次重启或回滚，请运维处理"
              sudo docker logs --tail 50 BakaGame || true
              exit 1
            fi
            say "业务就绪检查通过"

            rm -rf "$STASH"
            echo "========================================="
            echo "🎉 BakaGame 后端部署成功：$COMMIT（总耗时 $(elapsed)s）"
            echo "========================================="
            BAKA_DEPLOY_EOF
            bash "$DEPLOY_SH"
