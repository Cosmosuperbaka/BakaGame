name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'Server/**'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Pre-deployment Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install server dependencies
        working-directory: Server
        run: bun install --frozen-lockfile

      - name: Type check server
        working-directory: Server
        run: bun run check

      - name: Run server tests with coverage
        working-directory: Server
        run: bun run test:coverage

      - name: Smoke test production server
        working-directory: Server
        run: bun run test:production-smoke

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
          key: ${{ secrets.DEPLOY_KEY }}
          passphrase: ${{ secrets.DEPLOY_PASSPHRASE || secrets.DEPLOY_KEY_PASSPHRASE || '' }}
          command_timeout: 60m
          script_stop: true
          script: |
            set -euo pipefail

            echo "========================================="
            echo "🚀 开始执行 BakaGame 后端自动部署流程"
            echo "========================================="

            # 1. 切换至项目仓库目录
            cd /BakaGame
            echo "==> 当前工作目录: $(pwd)"

            # 2. 拉取远端最新代码并硬对齐 main 分支
            echo "==> 拉取远端最新代码..."
            git fetch origin main
            git reset --hard origin/main
            command -v git-lfs >/dev/null 2>&1 || { echo "❌ 生产机未安装 git-lfs"; exit 1; }
            git lfs install --local
            export GIT_LFS_CONCURRENT_TRANSFERS=8
            export GIT_LFS_TRANSFERS=basic
            export GIT_LFS_SKIP_SMUDGE=0
            git config lfs.concurrenttransfers 8
            git config lfs.dialtimeout 20
            git config lfs.activitytimeout 600
            git config lfs.tlstimeout 20
            lfs_ok=false
            for lfs_url in \
              "https://gh-proxy.com/https://github.com/Cosmosuperbaka/BakaGame.git/info/lfs" \
              "https://github.akams.cn/https://github.com/Cosmosuperbaka/BakaGame.git/info/lfs" \
              "https://ghfast.top/https://github.com/Cosmosuperbaka/BakaGame.git/info/lfs" \
              "https://github.com/Cosmosuperbaka/BakaGame.git/info/lfs"; do
              echo "==> 尝试 LFS 镜像: $lfs_url"
              git config remote.origin.lfsurl "$lfs_url"
              if git lfs pull origin main; then lfs_ok=true; break; fi
            done
            [ "$lfs_ok" = true ] || { echo "❌ 所有 LFS 镜像均下载失败"; exit 1; }
            valid_db() { [ -s "$1" ] && [ "$(head -c 15 "$1")" = "SQLite format 3" ]; }
            for db in Server/data/bangumi-song.sqlite Server/data/bangumi-character.sqlite; do
              if ! valid_db "$db"; then
                echo "❌ Bangumi 数据文件无效: $db"
                exit 1
              fi
            done
            CURRENT_COMMIT=$(git rev-parse --short HEAD)
            echo "==> 已对齐至最新提交: $CURRENT_COMMIT"

            # 3. 重启后端 Docker 容器（容器启动入口自带依赖同步与环境初始化）
            echo "==> 重启 BakaGame 容器..."
            sudo docker restart BakaGame

            # 4. 等待服务就绪并执行健康检查
            echo "==> 等待服务就绪并执行健康检查..."
            HEALTH_URL="http://127.0.0.1:4850/health"
            MAX_RETRIES=15
            RETRY_COUNT=0
            HEALTHY=false

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              RETRY_COUNT=$((RETRY_COUNT + 1))
              RESPONSE=$(curl -s -f "$HEALTH_URL" || true)
              if echo "$RESPONSE" | grep -q '"status":"ok"'; then
                echo "✅ 健康检查通过: $RESPONSE"
                HEALTHY=true
                break
              fi
              echo "⏳ 等待服务启动中 ($RETRY_COUNT/$MAX_RETRIES)..."
              sleep 2
            done

            if [ "$HEALTHY" = false ]; then
              echo "❌ 错误: 服务在 30 秒内未能通过健康检查！"
              echo "==> 最近 50 行容器日志："
              sudo docker logs --tail 50 BakaGame
              exit 1
            fi

            echo "========================================="
            echo "🎉 BakaGame 后端部署成功！版本: $CURRENT_COMMIT"
            echo "========================================="
