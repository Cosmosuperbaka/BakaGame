name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'Server/**'
      # 部署脚本自身变更也要触发，否则改完流水线得手工 dispatch 才能生效。
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Pre-deployment Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install server dependencies
        working-directory: Server
        run: bun install --frozen-lockfile

      - name: Type check server
        working-directory: Server
        run: bun run check

      - name: Run server tests with coverage
        working-directory: Server
        run: bun run test:coverage

      - name: Smoke test production server
        working-directory: Server
        run: bun run test:production-smoke

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [verify]
    # 生产部署硬超时：3 分钟。
    timeout-minutes: 3
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
          key: ${{ secrets.DEPLOY_KEY }}
          passphrase: ${{ secrets.DEPLOY_PASSPHRASE || secrets.DEPLOY_KEY_PASSPHRASE || '' }}
          command_timeout: 3m
          script_stop: true
          script: |
            set -euo pipefail

            REPO="Cosmosuperbaka/BakaGame"
            REF="main"
            DB_FILES="Server/data/bangumi-song.sqlite Server/data/bangumi-character.sqlite"
            # 数据库实体文件中转目录：与仓库同盘，mv 为原子改名，不产生拷贝开销。
            STASH="/BakaGame/.deploy-stash"
            # 单文件并行分片数。
            SPLIT=8
            # 下载绝对截止时间（相对脚本开始的秒数）。到点即干净失败，
            # 为后面的容器重启 + 健康检查留足余量，确保不会撞上 3 分钟硬超时。
            DL_DEADLINE=105
            # 可前缀拼接的 GitHub 代理节点（取自 https://github.akams.cn/ 节点列表）。
            # 必须用 raw 形态：https://<节点>/https://github.com/<repo>/raw/<ref>/<path>
            # 只有这个形态代理才会在服务端跟随 GitHub 到 media 的 302，返回 LFS 实体字节。
            MIRRORS="ghproxy.net ghfast.top ghfile.geekertao.top github.tbap.top git.yylx.win gh.dpik.top github-proxy.memory-echoes.cn gh.acmsz.top fastgit.cc gh.noki.icu github.ikgy.top github.mxw.qzz.io direct"

            T0=$(date +%s)
            say() { echo "[$(( $(date +%s) - T0 ))s] $*"; }
            elapsed() { echo $(( $(date +%s) - T0 )); }

            # 代理前缀形态：https://<节点>/https://github.com/.../raw/<ref>/<path>
            # 该形态会让代理在服务端跟随 GitHub 到 media.githubusercontent.com 的 302，
            # 拿到的是 LFS 实体字节，而不是指针文本。
            proxy_url() {
              if [ "$1" = "direct" ]; then
                printf 'https://github.com/%s/raw/%s/%s' "$REPO" "$REF" "$2"
              else
                printf 'https://%s/https://github.com/%s/raw/%s/%s' "$1" "$REPO" "$REF" "$2"
              fi
            }

            # 从 LFS 指针文件里取字段。纯 shell 实现：不依赖 git / awk / sed，
            # 因此不会因为外部命令缺失或管道异常把整个部署带崩。
            # $1 = 指针文件路径，$2 = 字段名（oid / size）
            lfs_field() {
              while read -r k v; do
                if [ "$k" = "$2" ]; then printf '%s' "${v#sha256:}"; return 0; fi
              done < "$1"
              return 1
            }

            restore_cache() {
              for f in $DB_FILES; do
                c="$STASH/$(basename "$f")"
                if [ -f "$c" ]; then
                  if [ ! -s "$f" ] || [ "$(head -c 15 "$f" 2>/dev/null)" != "SQLite format 3" ]; then
                    mv -f "$c" "$f" 2>/dev/null || true
                  fi
                fi
              done
            }

            on_exit() {
              rc=$?
              if [ "$rc" -ne 0 ]; then
                echo "==> 部署失败（退出码 $rc），回滚本地数据库文件，线上服务保持原状"
                restore_cache
              fi
              rm -rf "$STASH"/.probe "$STASH"/.parts.* "$STASH"/.merged.* 2>/dev/null || true
            }
            trap on_exit EXIT

            # 先把执行环境说清楚：远端 shell 到底是什么直接决定陷阱/shell 特性是否可用。
            say "执行环境：shell=$0 bash=${BASH_VERSION:-无} 内核=$(uname -s)"

            # 任何非预期失败都必须带着行号喊出来，绝不允许静默退出。
            # ERR 是 bash 专有信号，dash 下 `trap ... ERR` 会直接让脚本带 -e 退出，故按 shell 分支处理。
            if [ -n "${BASH_VERSION:-}" ]; then
              set -E
              trap 'echo "❌ 脚本第 ${LINENO} 行执行失败：$BASH_COMMAND"' ERR
            fi

            cd /BakaGame
            say "开始部署 BakaGame 后端"

            # ---------- 0. 环境自检 ----------
            for t in git curl awk sort tr wc head basename sha256sum date grep cp mv rm; do
              if ! command -v "$t" >/dev/null 2>&1; then
                echo "❌ 生产机缺少必需命令：$t"
                exit 1
              fi
            done

            # ---------- 1. 代码同步（LFS 实体文件由本脚本接管） ----------
            # 工作流已串行化（concurrency），上一次中断遗留的锁文件必然是陈旧的。
            if [ -f .git/index.lock ]; then
              say "清理上一次中断遗留的 .git/index.lock"
              rm -f .git/index.lock
            fi

            # 关键：禁止 git 在 checkout 阶段触碰 LFS。仓库里存的是指针文本，
            # 实体文件由本脚本自行提供，避免 git 去 github-cloud.githubusercontent.com 拉 200MB。
            export GIT_LFS_SKIP_SMUDGE=1
            git config --local filter.lfs.required false

            # 把已就位的实体文件挪出工作区（mv 是原子改名），
            # 这样 reset 之后工作区里躺着的是指针文本，实体由下面按需放回。
            mkdir -p "$STASH"
            for f in $DB_FILES; do
              if [ -f "$f" ]; then
                mv -f "$f" "$STASH/$(basename "$f")"
              fi
            done

            say "拉取远端代码"
            git fetch --no-tags origin "$REF"
            git reset --hard "origin/$REF" >/dev/null
            COMMIT=$(git rev-parse --short HEAD)
            say "已对齐至 $COMMIT"

            # reset 后工作区里是 LFS 指针文本。先把指针文件各留一份副本（133 字节），
            # 后面要用实体文件覆写工作区，届时就没法再读指针了；读取统一走 lfs_field。
            for f in $DB_FILES; do
              cp -f "$f" "$STASH/$(basename "$f").pointer"
              want=$(lfs_field "$STASH/$(basename "$f").pointer" oid || true)
              size=$(lfs_field "$STASH/$(basename "$f").pointer" size || true)
              say "目标数据库：$f oid=${want:-（非 LFS）} size=${size:-?}"
            done

            # ---------- 2. 数据库：OID 未变化则零网络复用，变化才下载 ----------
            PENDING=""
            for f in $DB_FILES; do
              cached="$STASH/$(basename "$f")"
              want=$(lfs_field "$STASH/$(basename "$f").pointer" oid || true)
              if [ -z "$want" ]; then
                say "未见 LFS 指针，按普通文件处理：$f（前 16 字节：$(head -c 16 "$f" 2>/dev/null)）"
                # 只有在 git 确实写入了真实内容时才丢弃暂存副本，避免把唯一的好文件删掉。
                if [ "$(head -c 15 "$f" 2>/dev/null)" = "SQLite format 3" ]; then
                  rm -f "$cached"
                fi
                continue
              fi
              if [ -f "$cached" ] && [ "$(head -c 15 "$cached")" = "SQLite format 3" ]; then
                hash=$(sha256sum "$cached"); hash=${hash%% *}
                if [ "$hash" = "$want" ]; then
                  mv -f "$cached" "$f"
                  say "复用本地数据库（LFS OID 未变化）：$f"
                  continue
                fi
                say "本地数据库已过期：$f（本地 $(printf '%.12s' "$hash") → 目标 $(printf '%.12s' "$want")）"
              else
                say "本地没有可复用的数据库：$f"
              fi
              PENDING="$PENDING $f"
            done

            if [ -n "$PENDING" ]; then
              say "需下载 LFS 数据：$PENDING"

              # 2.1 并行测速，挑出当前出口网络下最快的节点。
              PROBE_FILE=$(echo "$PENDING" | awk '{print $1}')
              PROBE_DIR="$STASH/.probe"
              rm -rf "$PROBE_DIR"; mkdir -p "$PROBE_DIR"
              idx=0
              for m in $MIRRORS; do
                idx=$((idx + 1))
                (
                  s=$(curl -sS -L --fail --connect-timeout 5 -o "$PROBE_DIR/body.$idx" \
                        --max-time 6 -r 0-131071 -w '%{speed_download}' \
                        "$(proxy_url "$m" "$PROBE_FILE")" 2>/dev/null || true)
                  # 只认真正吐回 SQLite 实体字节的节点：403/404 错误页体积小、速度虚高，
                  # 直接按 0 处理，免得把一个坏节点选成"最快"。
                  if [ "$(head -c 15 "$PROBE_DIR/body.$idx" 2>/dev/null)" = "SQLite format 3" ]; then
                    printf '%s %s\n' "${s:-0}" "$m" > "$PROBE_DIR/$idx"
                  else
                    printf '0 %s\n' "$m" > "$PROBE_DIR/$idx"
                  fi
                ) &
              done
              wait || true
              BEST=$(cat "$PROBE_DIR"/[0-9]* 2>/dev/null | sort -rn | head -n 1 | awk '{print $2}')
              BEST=${BEST:-direct}
              say "测速最快节点：$BEST（各节点测得速度：$(cat "$PROBE_DIR"/[0-9]* 2>/dev/null | awk '{printf "%s=%dKB/s ", $2, $1/1024}')）"

              # 2.2 多分片并行下载：首选最快节点，失败自动切换其它节点；
              #     每个分片严格受全局预算约束，保证不会拖爆 3 分钟硬超时。
              ORDER="$BEST $MIRRORS"
              DL_END=$(( T0 + DL_DEADLINE ))

              fetch_file() {
                f="$1"
                want=$(lfs_field "$STASH/$(basename "$f").pointer" oid || true)
                size=$(lfs_field "$STASH/$(basename "$f").pointer" size || true)
                if [ -z "$want" ] || [ -z "$size" ]; then
                  echo "❌ 无法读取 LFS 目标信息：$f"
                  return 1
                fi
                # 注意：两个文件是并行下载的，临时路径必须按文件名取唯一值。
                # bash 的 $$ 在子 shell 中仍是父进程 PID，不能用来做区分。
                tag=$(basename "$f")
                parts="$STASH/.parts.$tag"
                merged="$STASH/.merged.$tag"
                rm -rf "$parts" "$merged"; mkdir -p "$parts"
                chunk=$(( (size + SPLIT - 1) / SPLIT ))
                i=0
                while [ "$i" -lt "$SPLIT" ]; do
                  start=$(( i * chunk )); end=$(( start + chunk - 1 ))
                  if [ "$end" -ge "$size" ]; then end=$(( size - 1 )); fi
                  want_len=$(( end - start + 1 ))
                  (
                    for m in $ORDER; do
                      cap=$(( DL_END - $(date +%s) ))
                      if [ "$cap" -lt 8 ]; then break; fi
                      if [ "$cap" -gt 60 ]; then cap=60; fi
                      # --speed-limit/--speed-time：节点空有连接但不出流量时快速放弃，
                      # 让分片立刻换下一个节点，而不是把预算耗在死掉的镜像上。
                      if curl -sS -L --fail --connect-timeout 6 --max-time "$cap" \
                           --speed-limit 32768 --speed-time 20 \
                           -r "$start-$end" -o "$parts/$i" "$(proxy_url "$m" "$f")"; then
                        # 逐分片长度自校验：防住忽略 Range 直接回整文件的代理。
                        if [ "$(wc -c < "$parts/$i" | tr -d ' ')" = "$want_len" ]; then
                          exit 0
                        fi
                      fi
                    done
                    exit 1
                  ) &
                  i=$(( i + 1 ))
                done
                wait || true

                : > "$merged"
                i=0
                complete=true
                while [ "$i" -lt "$SPLIT" ]; do
                  if [ ! -s "$parts/$i" ]; then complete=false; fi
                  cat "$parts/$i" >> "$merged" 2>/dev/null || complete=false
                  i=$(( i + 1 ))
                done
                got=$(wc -c < "$merged" | tr -d ' ')
                if [ "$complete" = true ] && [ "$got" = "$size" ] \
                   && [ "$(sha256sum "$merged" | awk '{print $1}')" = "$want" ]; then
                  mv -f "$merged" "$f"
                  rm -rf "$parts"
                  return 0
                fi
                echo "    ✗ 下载校验失败：$f（期望 $size 字节，实际 $got 字节）"
                rm -rf "$parts" "$merged"
                return 1
              }

              pids=""
              for f in $PENDING; do
                fetch_file "$f" &
                pids="$pids $!"
              done
              dl_ok=true
              for p in $pids; do
                wait "$p" || dl_ok=false
              done
              if [ "$dl_ok" != true ]; then
                echo "❌ LFS 数据下载失败，本次部署中止"
                exit 1
              fi
              say "LFS 数据下载完成"
            fi

            # ---------- 3. 落盘校验 ----------
            for f in $DB_FILES; do
              want=$(lfs_field "$STASH/$(basename "$f").pointer" oid || true)
              if [ -n "$want" ]; then
                hash=$(sha256sum "$f"); hash=${hash%% *}
                if [ "$hash" != "$want" ]; then
                  echo "❌ 数据库校验失败：$f"
                  exit 1
                fi
              elif [ "$(head -c 15 "$f" 2>/dev/null)" != "SQLite format 3" ]; then
                echo "❌ 数据库文件无效：$f"
                exit 1
              fi
              say "校验通过：$f"
            done

            # ---------- 4. 重启后端容器（入口自带依赖同步与环境初始化） ----------
            say "重启 BakaGame 容器"
            sudo docker restart BakaGame

            # ---------- 5. 健康检查 ----------
            say "等待服务就绪"
            HEALTH_URL="http://127.0.0.1:4850/health"
            MAX_RETRIES=15
            RETRY_COUNT=0
            HEALTHY=false
            while [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; do
              RETRY_COUNT=$((RETRY_COUNT + 1))
              RESPONSE=$(curl -s -f "$HEALTH_URL" 2>/dev/null || true)
              if echo "$RESPONSE" | grep -q '"status":"ok"'; then
                HEALTHY=true
                break
              fi
              sleep 2
            done

            if [ "$HEALTHY" != true ]; then
              echo "❌ 服务在 30 秒内未通过健康检查，最近 50 行容器日志："
              sudo docker logs --tail 50 BakaGame || true
              exit 1
            fi
            say "健康检查通过"

            rm -rf "$STASH"
            echo "========================================="
            echo "🎉 BakaGame 后端部署成功：$COMMIT（总耗时 $(elapsed)s）"
            echo "========================================="
