<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="baidu-site-verification" content="codeva-XfSLOrQvOz" />
    <!--
      首帧主题恢复：必须在样式表与入口模块之前同步执行，否则深色偏好会先闪一帧亮色。
      这里只读 localStorage 与系统偏好，不复制任何颜色值；解析逻辑与 src/lib/Theme.ts 同名键一致，
      两处必须同步（Theme.test.ts 核对键名与落位方式）。
    -->
    <script>
      (() => {
        let stored = null;
        try {
          stored = localStorage.getItem("bakagame:theme");
        } catch {
          // 隐私模式下读不到：按系统偏好处理。
        }
        let dark;
        if (stored === "light" || stored === "dark") {
          dark = stored === "dark";
        } else {
          try {
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch {
            dark = false;
          }
        }
        const root = document.documentElement;
        root.classList.toggle("dark", dark);
        root.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>

    <!--
      页面级元信息（title / description / canonical / og）一律不写在这里。
      本站是 SPA，这些标签由各页面的 Seo 组件经 react-helmet-async 注入；
      若在入口 HTML 里再写一份，会在 <head> 中产生同名重复标签，
      搜索引擎遇到重复 canonical 会判定整组失效，比缺失更糟。
      此处只保留全站共通的站点级标签与首屏兜底标题。
    -->
    <title>BakaGame</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/Main.tsx"></script>
  </body>
</html>
