# 根级 pnpm workspace 成员。Server 与 Client 是仅有的两个真实包；
# apps/* 与 packages/* 预留给未来的可执行应用与可发布共享包，当前不存在对应目录，
# pnpm 会忽略不匹配任何 package.json 的 glob（不报错）。
#
# 安装期行为（node-linker、postinstall 放行）在根 .npmrc，改动前先读那里的注释。

packages:
  - "Client"
  - "Server"
  - "apps/*"
  - "packages/*"

# pnpm v10 默认拦截所有依赖的构建脚本（postinstall）；这里显式放行两个真正的使用方：
# - bun：postinstall 负责把 pin 的可执行文件落位到 node_modules/bun/bin（Server 全部脚本
#   都是 `bun ...`，缺它会命中上游预置的「postinstall 未运行」占位脚本直接退出）；
# - esbuild：postinstall 只做原生二进制校验。
# CI 干净环境（pnpm install --frozen-lockfile）实测缺此白名单必挂 Server CI（2026-10-13）。
onlyBuiltDependencies:
  - bun
  - esbuild

# TypeScript 双版本：编译器是 typescript7（npm:typescript@7，tsc），API 面是 typescript
# （npm:@typescript/typescript6@6，tsc6）。eslint-plugin-sonarjs 把 typescript 写成硬依赖
# （>=5 <6.1.0），ts-api-utils 又按它的 peer 变体提升；不覆写的话 pnpm 会给它们各自嵌套装
# 一份真 typescript@5.9.3，类型感知规则就会用 5.9 的 TypeFlags 去读 6.0 创建的 Program，
# no-misused-promises 直接崩（unionConstituents 拿到不可迭代的结果）。
# 覆写只针对依赖名 typescript，不动 typescript7 这个别名键。
overrides:
  typescript: npm:@typescript/typescript6
