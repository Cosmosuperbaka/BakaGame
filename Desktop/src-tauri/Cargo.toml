[package]
name = "bakagame-desktop"
version = "0.2.3"
description = "BakaGame 桌面壳：远程 URL 窗口 + 设备密钥签名 + 原生自检"
authors = ["BakaGame"]
edition = "2021"

[lib]
name = "bakagame_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "bakagame-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# WebView2 + 窗口 + IPC；不打包前端，壳只加载远程 URL。
# `macos-proxy` 让 macOS 的 WKWebView 也能指向 HTTPDNS 回环隧道（`proxy_url`）：它链接 macOS 14 才有的
# Network 框架接口，所以 tauri.macos.conf.json 的最低系统版本不能低于 14；Windows 上不参与编译。
tauri = { version = "2", features = ["macos-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 设备密钥对：Ed25519 私钥签名服务端 challenge。
# 用 default features（fast + std + zeroize）：`zeroize` 让私钥在 drop 时清零，
# 这一条对「私钥存在用户机器上」的威胁模型是实质收益，不要用 default-features = false 关掉。
# 额外的 `rand_core` 只用来放开 `SigningKey::generate`（默认不带随机源）。
ed25519-dalek = { version = "2", features = ["rand_core"] }
# 只为拿到 `OsRng`（`getrandom` feature 提供系统 CSPRNG）；种子生成走 `SigningKey::generate`
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
# 注册与通道证明（challenge / attest）走阻塞客户端：`http.rs` 是唯一构造点，
# 只允许在后台线程或 `spawn_blocking` 里调用——`reqwest::blocking` 在 async 上下文会 panic。
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "native-tls"] }
# HTTPDNS 的 AES 模式（腾讯云授权 ID + 16 位 AES 密钥）：AES-128-CBC/PKCS7，
# 密文以十六进制拼在 dn 参数里。只用于 DN 解析查询，不参与通道签名。
aes = "0.8"
cbc = "0.1"
hex = "0.4"
# HTTPS Token 模式的 DNS 查询走 native-tls：证书校验保持默认开启，不能为了
# 连一个 IP 就放行非法证书；Token 模式优先于 AES 模式。
native-tls = "0.2"
# 壳本体自动更新（官方插件，只在 Rust 侧用，页面拿不到它自带的命令）。走 native-tls 与上面同一套证书校验，
# 不引入 rustls；`zip` 带上解 macOS 的 .app.tar.gz 所需的解包依赖；`system-proxy` 让下载与 WebView 一样
# 认系统代理设置。更新包的签名由插件用 tauri.conf.json 里的公钥校验。
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["native-tls", "zip", "system-proxy"] }
# 记住窗口位置、尺寸与最大化状态（官方插件，只在 Rust 侧用）；恢复后再由 window_fit 收进工作区
tauri-plugin-window-state = "2.5.0"

# 把客户端段追加到 WebView 默认 UA 之后要走平台接口（见 src/webview_ua.rs）。版本与 wry 用的同一套，
# 不会多编一份：Windows 是 WebView2 的 COM 绑定，macOS 是 WKWebView 的 Objective-C 绑定；
# macOS 另用 libc 的 sysctlbyname 取系统版本与真实架构。
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# 只剥符号表：.rodata 里的条款文本与蜜标必须保持 `strings` 可读
strip = true
# 不设 panic = "abort"：后台线程（注册 / 自检）里的 panic 不应带走整个客户端
